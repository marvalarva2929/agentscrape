[project]
name = "agentscrape"
version = "0.1.0"
description = "Contact extraction backend for post-secondary / academic medical institutions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "playwright>=1.49",
    "langgraph>=0.2.50",
    "psycopg[binary,pool]>=3.2",
    "openai>=1.57",
    "typer>=0.15",
    "rich>=13.9",
    "python-multipart>=0.0.18",
    "pyjwt>=2.10",
    "psutil>=6.1",
    "email-validator>=2.2",
    "tenacity>=9.0",
]

[project.scripts]
agentscrape = "agentscrape.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "anyio>=4.7", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentscrape"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "RUF", "FURB"]
ignore = [
    "E501",     # long lines are reformatted, not errored on
    "RUF012",   # ClassVar annotations add noise to plain config dicts
    "B008",     # FastAPI's Depends()/Query() defaults are the framework idiom
    "SIM105",   # `except X: pass` in cleanup paths reads better inline
    "RUF001",   # accented names and typographic apostrophes are intentional
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408"]
# Deliberate: `except X: pass` in cleanup paths reads more clearly inline than
# wrapped in contextlib.suppress, and the unicode flagged by RUF001/RUF003 is
# intentional (accented names, typographic apostrophes) in patterns and docs.
